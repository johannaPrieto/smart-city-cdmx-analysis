@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

body {
    font-family: 'Inter', sans-serif !important;
    background-color: #0f1117;
}

/* Glassmorphism Title */
.modern-title {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: rgba(20, 22, 30, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 15px 35px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #ffffff;
    text-align: center;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    animation: fadeInDown 0.8s ease-out;
}
.modern-title h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
}
.modern-title p {
    margin: 4px 0 0 0;
    font-size: 12px;
    color: #A0AABF;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Stat Cards */
.stat-cards-container {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: fadeInLeft 0.8s ease-out;
}
.stat-card {
    background: rgba(20, 22, 30, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: white;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 15px;
    transition: transform 0.2s ease, background 0.2s ease;
    min-width: 180px;
}
.stat-card:hover {
    transform: translateX(5px);
    background: rgba(30, 33, 45, 0.85);
}
.stat-icon {
    font-size: 22px;
    opacity: 0.9;
}
.stat-info h4 {
    margin: 0;
    font-size: 10px;
    color: #A0AABF;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
}
.stat-info p {
    margin: 2px 0 0 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

/* Layer Control Overrides */
.leaflet-control-layers {
    background: rgba(20, 22, 30, 0.85) !important;
    backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    border-radius: 12px !important;
    color: #E0E0E0 !important;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3) !important;
    padding: 10px !important;
    animation: fadeInRight 0.8s ease-out;
}
.leaflet-control-layers-expanded {
    padding: 16px 20px !important;
    min-width: 220px;
}
.leaflet-control-layers-overlays label {
    margin-bottom: 10px !important;
    display: flex !important;
    align-items: center !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 13px !important;
    cursor: pointer !important;
    transition: color 0.2s;
}
.leaflet-control-layers-overlays label:hover {
    color: #ffffff !important;
}
.leaflet-control-layers input[type="checkbox"] {
    appearance: none;
    background-color: rgba(255,255,255,0.05);
    margin: 0 12px 0 0 !important;
    font: inherit;
    color: currentColor;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    display: grid;
    place-content: center;
    border: 1px solid rgba(255, 255, 255, 0.2);
    cursor: pointer;
    transition: all 0.2s;
}
.leaflet-control-layers input[type="checkbox"]::before {
    content: "";
    width: 10px;
    height: 10px;
    transform: scale(0);
    transition: 120ms transform ease-in-out;
    box-shadow: inset 1em 1em white;
    background-color: white;
    transform-origin: center;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
}
.leaflet-control-layers input[type="checkbox"]:checked {
    background-color: #3b82f6; /* Default blue, can be overridden */
    border-color: #3b82f6;
}
.leaflet-control-layers input[type="checkbox"]:checked::before {
    transform: scale(1);
}
.leaflet-control-layers-separator {
    border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
    margin: 12px 0 !important;
}

/* Custom Legend & Info Cards */
.modern-legend {
    position: fixed;
    bottom: 30px;
    right: 20px;
    z-index: 9999;
    background: rgba(20, 22, 30, 0.85);
    backdrop-filter: blur(12px);
    padding: 15px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #E0E0E0;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    font-family: 'Inter', sans-serif;
    animation: fadeInUp 0.8s ease-out;
    width: 220px;
    transition: transform 0.2s;
}
.modern-legend:hover {
    transform: translateY(-5px);
}
.modern-legend h4 {
    margin: 0 0 12px 0;
    font-size: 12px;
    color: #ffffff;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.legend-gradient {
    height: 6px;
    border-radius: 3px;
    margin-bottom: 8px;
    width: 100%;
}
.legend-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #A0AABF;
    font-weight: 600;
}

.modern-guide {
    position: fixed;
    bottom: 30px;
    left: 20px;
    z-index: 9999;
    background: rgba(20, 22, 30, 0.85);
    backdrop-filter: blur(12px);
    padding: 18px 22px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #A0AABF;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.6;
    animation: fadeInUp 0.8s ease-out;
    max-width: 280px;
    transition: transform 0.2s;
}
.modern-guide:hover {
    transform: translateY(-5px);
}
.modern-guide h4 {
    margin: 0 0 10px 0;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
}
.modern-guide p {
    margin: 0;
}

/* Animations */
@keyframes fadeInDown {
    from { opacity: 0; transform: translate(-50%, -20px); }
    to { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes fadeInLeft {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
}
@keyframes fadeInRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
